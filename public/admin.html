<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardik Trader Admin</title><link rel="stylesheet" href="/style.css"><style>body{background:#080d18;color:#f4f6fb;font-family:Arial,sans-serif;padding:20px}.admin{max-width:900px;margin:auto}.admin-card{background:#121b2c;border:1px solid #2a3a54;border-radius:14px;padding:18px;margin:14px 0}.admin input{display:block;width:100%;box-sizing:border-box;margin:8px 0 14px;padding:12px;background:#080d18;color:white;border:1px solid #3b4d67;border-radius:8px}.admin button{padding:11px 16px;background:#e8b923;color:#111;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.request{border-top:1px solid #334;padding:12px 0}.muted{color:#9caec7}.pw{color:#43e18a;font-weight:bold;word-break:break-all}</style></head><body><div class="admin"><h1>HARDIK TRADER — Admin Panel</h1><p class="muted">Review submitted access requests. Verify deposits manually before approving.</p><div class="admin-card" id="loginCard"><label>Admin password</label><input type="password" id="adminPassword" autocomplete="current-password"><button id="adminLogin">Login</button><p id="error"></p></div><div id="requests" hidden><button id="refresh">Refresh requests</button><div id="list"></div></div></div><script>
let token='';const $=id=>document.getElementById(id);async function api(url,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(url,opts);let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
$('adminLogin').onclick=async()=>{try{let d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('adminPassword').value})});token=d.token;$('loginCard').hidden=true;$('requests').hidden=false;load()}catch(e){$('error').textContent=e.message}};
async function load(){try{let d=await api('/api/admin/requests');$('list').innerHTML=d.requests.length?d.requests.map(x=>`<div class="admin-card"><b>${esc(x.telegram)}</b> <span class="muted">${esc(x.status)} · ${esc(x.createdAt)}</span><p>Quotex account ID: ${esc(x.accountId)}</p><p>Deposit reference: ${esc(x.depositReference)}</p>${x.password?`<p class="pw">Access password: ${esc(x.password)}</p><button onclick="copyPw('${esc(x.password)}')">Copy password</button> <p class="muted">Send this password to ${esc(x.telegram)} on Telegram after verification.</p>`:`<button onclick="approve('${x.id}')">Approve & generate password</button>`}</div>`).join(''):'<p>No requests yet.</p>'}catch(e){$('list').textContent=e.message}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.approve=async id=>{if(!confirm('Confirm you have manually verified this account and deposit?'))return;try{let d=await api('/api/admin/approve/'+id,{method:'POST',body:'{}'});alert('Generated password: '+d.password+'\nSend it to '+d.telegram+' via Telegram.');load()}catch(e){alert(e.message)}};window.copyPw=p=>navigator.clipboard?.writeText(p).then(()=>alert('Copied')).catch(()=>alert(p));$('refresh').onclick=load;
</script></body></html>
